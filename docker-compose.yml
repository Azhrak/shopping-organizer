services:
  postgres:
    image: postgres:17-alpine
    container_name: hintavahti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hintavahti
    ports:
      # 5434 on the host to avoid colliding with a local Postgres (5432) and
      # with spicy-tales' container (5433).
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: hintavahti-adminer
    restart: unless-stopped
    ports:
      - "8201:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
